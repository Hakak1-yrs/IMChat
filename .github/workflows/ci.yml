name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIMCHAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Unit tests, shuffled and repeated
        run: build\bin\Release\IMChatUnitTests.exe --gtest_shuffle --gtest_repeat=5

      - name: Benchmark smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory bench_data | Out-Null
          build\bin\Release\IMChatBench.exe prepare bench_data 200
          $server = Start-Process build\bin\Release\IMChatServer.exe -ArgumentList "--port","9600","--data","bench_data" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 1
          build\bin\Release\IMChatBench.exe run --data bench_data --port 9600 --clients 100 --messages 50
          $privateExit = $LASTEXITCODE
          build\bin\Release\IMChatBench.exe run --data bench_data --port 9600 --clients 50 --messages 20 --group
          $groupExit = $LASTEXITCODE
          Stop-Process -Id $server.Id
          if ($privateExit -ne 0 -or $groupExit -ne 0) { exit 1 }
