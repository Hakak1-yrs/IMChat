name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIMCHAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Unit tests, shuffled and repeated
        run: build\bin\Release\IMChatUnitTests.exe --gtest_shuffle --gtest_repeat=5

      - name: Benchmark smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory bench_data | Out-Null
          build\bin\Release\IMChatBench.exe prepare bench_data 200
          $server = Start-Process build\bin\Release\IMChatServer.exe -ArgumentList "--port","9600","--data","bench_data","--rate-limit","0" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 1
          build\bin\Release\IMChatBench.exe run --data bench_data --port 9600 --clients 100 --messages 50
          $privateExit = $LASTEXITCODE
          build\bin\Release\IMChatBench.exe run --data bench_data --port 9600 --clients 50 --messages 20 --group
          $groupExit = $LASTEXITCODE
          Stop-Process -Id $server.Id
          if ($privateExit -ne 0 -or $groupExit -ne 0) { exit 1 }

  windows-asan:
    runs-on: windows-latest
    continue-on-error: true   # 新加入的任务，先不阻塞合并
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC AddressSanitizer)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIMCHAT_SANITIZE=address

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Put the ASan runtime on PATH
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter clang_rt.asan_dynamic-x86_64.dll | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $dll.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  linux:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            sanitize: ""
          - name: asan-ubsan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    # 消毒器任务刚加入，先不阻塞合并；普通的 gcc 编译和测试必须通过
    continue-on-error: ${{ matrix.sanitize != '' }}
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMCHAT_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test (epoll)
        run: ctest --test-dir build --output-on-failure

      - name: Network tests with poll instead of epoll
        run: IMCHAT_POLLER=poll build/bin/IMChatUnitTests --gtest_filter='PollerTest.*:EventLoopTest.*:IoThreads/*:TcpClientTest.*:ChatServerTest.*:ChatClientTest.*'

      # 模糊测试多换几个随机种子；在消毒器任务里同时检查内存错误（ASan/UBSan）和数据竞争（TSan，多 I/O 线程）
      - name: Fuzz the server with more seeds
        run: |
          for seed in $(seq 1 20); do
            IMCHAT_FUZZ_SEED=$seed build/bin/IMChatUnitTests --gtest_filter='ServerFuzzTest.*' || exit 1
            IMCHAT_FUZZ_SEED=$seed IMCHAT_TEST_STORAGE=sqlite IMCHAT_TEST_IO_THREADS=2 \
              build/bin/IMChatUnitTests --gtest_filter='ServerFuzzTest.*' || exit 1
          done

      - name: Benchmark smoke test
        if: matrix.sanitize == ''
        run: |
          mkdir bench_data
          build/bin/IMChatBench prepare bench_data 200
          build/bin/IMChatServer --port 9600 --data bench_data --rate-limit 0 &
          sleep 1
          build/bin/IMChatBench run --data bench_data --port 9600 --clients 100 --messages 50
          build/bin/IMChatBench run --data bench_data --port 9600 --clients 50 --messages 20 --group
          kill %1
