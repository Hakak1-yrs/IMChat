<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<title>IMChat</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<!-- IMChat 网页客户端：手机、平板或者任何浏览器打开 IMChatServer 的地址（如 http://192.168.1.5:9000）即可使用。
     与服务端之间用 WebSocket，每条 WebSocket 消息里装一帧和原生客户端完全相同的协议帧（docs/PROTOCOL.md）。
     web/ 目录在构建时整个嵌进服务端程序，不依赖任何外部资源，局域网里没有外网也能用。
     脚本是浏览器原生的 ES 模块，不需要打包工具：
       js/protocol.js  帧的编解码          js/net.js      连接、请求与响应、心跳
       js/store.js     登录、同步、消息     js/ui.js       界面工具、弹层、页面栈
       js/main.js      主界面的四个标签页   js/chat.js     聊天页
       js/friends.js   好友                js/groups.js   群
       js/moments.js   朋友圈              js/account.js  个人中心、注册、平台概况
       js/room.js      实时群聊室          js/p2p.js      点对点聊天
       js/app.js       入口 -->
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
